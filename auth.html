<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Engilearn</title>
    <style>
        :root {
            --bg: #0b0d11;
            --text: #e8eef9;
            --muted: #cdcdcd;
            --accent: #0b5910;
            --accent-2: #0bf45d;
            --card: #121621;
            --glass: rgba(255, 255, 255, .06);
            --border: rgba(255, 255, 255, .12);
            --shadow: 0 10px 30px rgba(0, 0, 0, .35);
            --radius: 20px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: radial-gradient(1200px 800px at 80% -10%, rgba(124, 92, 255, .25), transparent 60%),
                        radial-gradient(1000px 700px at -10% 10%, rgba(0, 224, 209, .2), transparent 55%), var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            animation: fadeIn .6s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: none; } }

        .logo-center {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 60px; height: 60px; border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; color: #fff;
            margin-bottom: 16px;
        }
        .logo-center h1 { margin: 0; font-size: 1.6rem; }
        .logo-center p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--glass);
            border-radius: 12px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: .95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: .2s;
        }
        .tab.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: .9rem;
            color: var(--muted);
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: .2s;
        }
        .form-group input:focus {
            border-color: var(--accent-2);
            background: rgba(255,255,255,.08);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }
        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(255, 68, 68, .15);
            border: 1px solid rgba(255, 68, 68, .3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: .9rem;
            display: none;
        }
        .error.show { display: block; }

        .success {
            background: rgba(11, 244, 93, .15);
            border: 1px solid rgba(11, 244, 93, .3);
            color: #0bf45d;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: .9rem;
            display: none;
        }
        .success.show { display: block; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: .9rem;
            text-decoration: none;
        }
        .back-link:hover { color: var(--text); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="logo-center">
        <div class="logo-icon">E</div>
        <h1>Engilearn</h1>
        <p>Connectez-vous pour gérer vos cours</p>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-login" onclick="switchTab('login', this)">Connexion</button>
        <button class="tab" id="tab-register" onclick="switchTab('register', this)">Inscription</button>
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <!-- Formulaire de connexion -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Nom d'utilisateur ou Email</label>
            <input type="text" id="loginUser" required placeholder="votre_nom">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="loginPass" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" id="btnLogin">Se connecter</button>
    </form>

    <!-- Formulaire d'inscription -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>Nom d'utilisateur</label>
            <input type="text" id="regUser" required placeholder="votre_nom" minlength="3">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" required placeholder="vous@email.com">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="regPass" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="btnRegister">Créer un compte</button>
    </form>

    <a href="/" class="back-link">← Retour au site</a>
</div>

<script>
    const API_URL = '';

    // Rediriger si déjà connecté
    const token = localStorage.getItem('engilearn_token');
    if (token) {
        fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(r => { if (r.ok) window.location.href = '/'; });
    }

    function switchTab(tab, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
        document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.classList.add('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg;
        el.classList.add('show');
        document.getElementById('errorMsg').classList.remove('show');
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.textContent = loading ? 'Chargement...' : (btnId === 'btnLogin' ? 'Se connecter' : 'Créer un compte');
    }

    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;

        if (!username || !password) return showError('Veuillez remplir tous les champs');

        setLoading('btnLogin', true);
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) {
                setLoading('btnLogin', false);
                return showError(data.error || 'Erreur de connexion');
            }

            localStorage.setItem('engilearn_token', data.token);
            localStorage.setItem('engilearn_user', data.username);
            window.location.href = '/';
        } catch (err) {
            setLoading('btnLogin', false);
            showError('Erreur réseau — vérifiez que le serveur est lancé');
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById('regUser').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPass').value;

        if (!username || !email || !password) return showError('Veuillez remplir tous les champs');
        if (username.length < 3) return showError('Le nom d'utilisateur doit faire au moins 3 caractères');
        if (password.length < 6) return showError('Le mot de passe doit faire au moins 6 caractères');

        setLoading('btnRegister', true);
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            if (!res.ok) {
                setLoading('btnRegister', false);
                return showError(data.error || 'Erreur d'inscription');
            }

            localStorage.setItem('engilearn_token', data.token);
            localStorage.setItem('engilearn_user', data.username);
            showSuccess('Compte créé avec succès ! Redirection...');
            setTimeout(() => { window.location.href = '/'; }, 800);
        } catch (err) {
            setLoading('btnRegister', false);
            showError('Erreur réseau — vérifiez que le serveur est lancé');
        }
    }
</script>

</body>
</html>
